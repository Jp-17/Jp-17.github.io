---
layout: default
---

<article>
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <div class="post-meta">
      <div class="post-meta-text">
        <span class="post-date-display">{{ page.date | date: "%Y-%m-%d" }}</span>
        {% if page.author_note %}
        <span class="post-note-display">{{ page.author_note }}</span>
        {% endif %}
      </div>
    </div>
  </header>

  <div class="post-toc" id="post-toc" aria-label="Table of contents"></div>

  <div class="post-body">
    {{ content }}
  </div>
</article>

<script>
(function () {
  function ensureId(el, idx) {
    if (!el.id) {
      var base = el.textContent.trim()
        .replace(/\s+/g, '-')
        .replace(/[^\w\u4e00-\u9fff-]/g, '')
        .substring(0, 40);
      el.id = base || ('toc-' + idx);
    }
    return el.id;
  }

  function buildTOC() {
    var toc = document.getElementById('post-toc');
    if (!toc) return;
    var container = document.querySelector('.post-body');
    if (!container) return;

    var headings = Array.prototype.slice.call(container.querySelectorAll('h2, h3'));
    if (headings.length < 2) { toc.style.display = 'none'; return; }

    toc.style.display = '';
    headings.forEach(function (h, i) { ensureId(h, i); });

    var html = '<span class="post-toc-label">Contents</span><ul class="post-toc-list">';
    headings.forEach(function (h) {
      var cls = h.tagName === 'H3' ? ' toc-h3' : '';
      html += '<li class="toc-item' + cls + '"><a href="#' + h.id + '">'
            + h.textContent.trim() + '</a></li>';
    });
    html += '</ul>';
    toc.innerHTML = html;
  }

  buildTOC();
})();
</script>

{% if page.math %}
<script>
  MathJax = {
    tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
    svg: { fontCache: 'global' }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
{% endif %}
